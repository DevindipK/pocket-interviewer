name = "pocket-interviewer-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://devindipk.github.io,http://localhost:5173"
# Tried in order; the next one is used if a model is retired or rate-limited.
TEXT_MODELS = "gemini-3.8-flash,gemini-3.5-flash-lite,gemini-2.5-flash"
AUDIO_MODELS = "gemini-3.5-flash-lite,gemini-2.5-flash,gemini-3.8-flash"

# GEMINI_API_KEY is a secret: set it with `npx wrangler secret put GEMINI_API_KEY`
# (and in worker/.dev.vars for local testing). Never commit it.
